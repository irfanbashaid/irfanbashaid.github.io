<html>
    <head>
        <title>D-APP</title>
        <script src="https://cdn.jsdelivr.net/npm/web3@4.16.0/dist/web3.min.js" integrity="sha256-8DNAKV15Ktt2PHd+qpYDmqgxwkAr18vJcNtEkx+nNrg=" crossorigin="anonymous"></script>
    </head>
    <body>
        <h1>Ethereum based voting platform</h1>
        <div style="display: flex;">
            <div style="margin-left: auto; margin-right: 20px;">Wallet Address: <span id="walletAddress">...</span></div>
            <div style="margin-right: auto; margin-left: 20px;">Balance: <span id="walletBalance"></span></div>
        </div>
        <br/>
        <br/>
        <div style="display: flex;">
            <div style="margin-left: auto; margin-right: 20px;">
                <p>TRUMP</p>
                <img src="https://upload.wikimedia.org/wikipedia/commons/1/16/Official_Presidential_Portrait_of_President_Donald_J._Trump_%282025%29.jpg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original"/>
                <p>Live Vote Count: <span id="TRUMP_VOTES">...</span></p>
                <button onclick="vote('TRUMP')">VOTE</button>
            </div>
            <div style="margin-right: auto; margin-left: 20px;">
                <p>BIDEN</p>
                <img src="https://upload.wikimedia.org/wikipedia/commons/6/68/Joe_Biden_presidential_portrait.jpg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original"/>
                <p>Live Vote Count: <span id="BIDEN_VOTES">...</span></p>
                <button onclick="vote('BIDEN')">VOTE</button>
            </div>
        </div>
        <br/>
        <br/>
        <br/>
        <br/>
        <br/>

        <div>
            <button onclick="result()">Result</button>
        </div>
        <script>
            let contractIns;
            let walletAddress;
            let web3Ins;
            function setBalance(walletAddress){
                web3Ins.eth.getBalance(walletAddress).then((balance,error)=> {
                    console.log(balance)
                    console.log(error)
                    document.getElementById("walletBalance").innerText = web3Ins.utils.fromWei(balance, 'ether')+ ' ETH';
                });
            }
            function setWalletAddress(walletAddr) {
                walletAddress = walletAddr;
                document.getElementById("walletAddress").innerText = walletAddr;
                setBalance(walletAddr);
                voteCount('BIDEN')
                voteCount('TRUMP')
            }
            async function init(){
                web3Ins = new window.Web3(window.ethereum);
                let connRes = await window.ethereum.enable();
                let votingContractAddress = "0x7779a5f9f17f2f77fe5e68b2922ceebdb70cb2d5";
              
                let ABIJSON = [
                    {
                        "constant": true,
                        "inputs": [
                            {
                                "name": "candName",
                                "type": "string"
                            }
                        ],
                        "name": "noOfVotes",
                        "outputs": [
                            {
                                "name": "",
                                "type": "uint256"
                            }
                        ],
                        "payable": false,
                        "stateMutability": "view",
                        "type": "function"
                    },
                    {
                        "constant": false,
                        "inputs": [],
                        "name": "startVoting",
                        "outputs": [],
                        "payable": false,
                        "stateMutability": "nonpayable",
                        "type": "function"
                    },
                    {
                        "constant": true,
                        "inputs": [],
                        "name": "getBlockchainTime",
                        "outputs": [
                            {
                                "name": "",
                                "type": "uint256"
                            }
                        ],
                        "payable": false,
                        "stateMutability": "view",
                        "type": "function"
                    },
                    {
                        "constant": true,
                        "inputs": [],
                        "name": "result_state",
                        "outputs": [
                            {
                                "name": "",
                                "type": "string"
                            }
                        ],
                        "payable": false,
                        "stateMutability": "view",
                        "type": "function"
                    },
                    {
                        "constant": false,
                        "inputs": [
                            {
                                "name": "_candName",
                                "type": "string"
                            }
                        ],
                        "name": "voting",
                        "outputs": [],
                        "payable": false,
                        "stateMutability": "nonpayable",
                        "type": "function"
                    },
                    {
                        "inputs": [],
                        "payable": false,
                        "stateMutability": "nonpayable",
                        "type": "constructor"
                    }
                ];
                contractIns = new web3Ins.eth.Contract(ABIJSON,votingContractAddress);
                  setWalletAddress(connRes[0]);
                console.log(web3Ins);
                console.log(window);
                console.log(contractIns);

            }
            init();
// myContract.methods.myMethod(123).send({from: '0xde0B295669a9FD93d5F28D9Ec85E40f4cb697BAe'})
// .on('transactionHash', function(hash){
//     ...
// })
// .on('receipt', function(receipt){
//     ...
// })
// myContract.methods.myMethod(123).call({from: '0xde0B295669a9FD93d5F28D9Ec85E40f4cb697BAe'}, function(error, result){
//     ...
// });
            function vote(candName) {
                contractIns._methods.voting(candName).send({from: walletAddress})
                .on('receipt', function(receipt){
                    if(receipt.status) {
                        voteCount('BIDEN')
                        voteCount('TRUMP')
                        return alert("Successfully voted");
                    } else {
                        return alert("Tx failed");
                    }
                })
            }
            function result() {
                console.log("result");
                contractIns._methods.result_state().call().then(function(result){
                    return alert(result);
                }); 
            }
            function voteCount(candName) {
                contractIns._methods.noOfVotes(candName).call().then(function(result){
                    document.getElementById(candName+"_VOTES").innerText = result;
                });
            }
        </script>
        <style>
            img {
                width: 300px;
                height: 400px;
                border-radius: 7px;
            }
            body {
                text-align: center;
            }
            button {
                padding: 10px 20px;
                color: red;
                background-color: aqua;
                border-radius: 7px;
            }
        </style>
    </body>
</html>
